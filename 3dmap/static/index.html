<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Cesium demo2</title>
    <script src="Cesium/Cesium.js"></script>
    <script src="http://api.tianditu.gov.cn/cdn/plugins/cesium/cesiumTdt.js" ></script>
    <style>
      @import url(Cesium/Widgets/widgets.css);

      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: relative;
      }

      .cesium-infoBox-visible {
        display: none;
      }

      #info {
        position: fixed;
        width: 250px;
        height: 80px;
        top: 50px;
        padding: 10px;
        color: red;
        font-size: 12px;
        background: white;
        border-radius: 3px;
        box-sizing: border-box;
        display: none;
      }

      #info-close {
        position: absolute;
        top: -5px;
        right: -3px;
        padding: 10px;
        color: #ccc;
        cursor: pointer;
      }

      .info-name {
        font-weight: bold;
        font-size: 16px;
      }

      .info-add,
      .info-name {
        width: 250px;
        height: 30px;
        line-height: 30px;
        color: black;
        box-sizing: border-box;
        z-index: 999;
      }

      .info-none {
        width: 0;
        height: 0;
        position: absolute;
        left: 110px;
        bottom: -25px;
        border-color: transparent transparent white;
        border-width: 15px;
        border-style: solid;
        transform: rotate(180deg);
      }

      #bottom {
        position: relative;
        width: 70%;
        bottom: 25px;
        color: white;
      }

      .bottom-info {
        margin: 0 15px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="info"></div>
    <div id="bottom" title="版权信息">
      <div class="bottom-info"> Copyright：Aalin</div>
      <div class="bottom-info"> E-mail：gmaj88@163.com</div>
      <div class="bottom-info"> Tel：15361466277</div>
    </div>

    <script src="./Cesium/marker.js"></script>
    <script src="./Cesium/bases.js"></script>
    <script src="./Cesium/click.js"></script>
  </body>
</html>
